[package]
name = "lfm"
version = "0.1.0"
edition.workspace = true
# a port of the model's transformers code (Apache-2.0); see LICENSE.md
license = "FSL-1.1-ALv2 AND Apache-2.0"
description = "LFM3-Audio-2B speech to text and text to speech on the CPU, in plain Rust"

[dependencies]
serde_json.workspace = true
regex.workspace = true
libc.workspace = true
socket2.workspace = true
rayon.workspace = true
matrixmultiply.workspace = true
wgpu = { workspace = true, optional = true }
bytemuck = { workspace = true, optional = true }

[features]
# the language model and the depth decoder on a GPU (gpu.rs), chosen at run time with --device gpu
gpu = ["dep:wgpu", "dep:bytemuck"]
